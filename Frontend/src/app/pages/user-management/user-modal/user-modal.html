<div class="dialog-overlay" *ngIf="isOpen" (click)="onCancel()"></div>

<div class="dialog-content" role="dialog" *ngIf="isOpen" tabindex="-1">
  <div class="dialog-header">
    <h2 class="dialog-title">Create New User</h2>
    <button type="button" class="dialog-close" (click)="onCancel()">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-close">
        <path d="M18 6 6 18" /><path d="M6 6l12 12" />
      </svg>
    </button>
  </div>

  <form class="dialog-form" (ngSubmit)="onSubmit(userForm)" #userForm="ngForm">

    <div class="form-grid">
      <div class="form-group">
        <label class="form-label" for="name">Full Name</label>
        <input class="form-input" id="name" name="name" [(ngModel)]="newUser.name" required />
      </div>

      <div class="form-group">
        <label class="form-label" [class.invalid]="emailField.invalid && emailField.touched" for="email">Email</label>
        <input
          class="form-input"
          [class.invalid]="emailField.invalid && emailField.touched"
          id="email"
          name="email"
          type="email"
          email
          [(ngModel)]="newUser.email"
          #emailField="ngModel"
          required
        />
        <p class="field-error" *ngIf="emailField.invalid && emailField.touched">Enter a valid email</p>
      </div>
    </div>

    <p class="form-hint">This user will log in by email OTP.</p>

    <div class="form-grid">
      <div class="form-group">
        <label class="form-label" for="phone">Phone</label>
        <input class="form-input" id="phone" name="phone" placeholder="+91..." [(ngModel)]="newUser.phone" />
      </div>

      <div class="form-group">
        <label class="form-label" for="role">Role</label>
        <select class="form-select" id="role" name="role" [(ngModel)]="newUser.role">
          <option *ngFor="let r of roles" [value]="r.value">{{ r.label }}</option>
        </select>
      </div>
    </div>

    <div class="form-group">
      <label class="form-label" for="address">Address</label>
      <input class="form-input" id="address" name="address" [(ngModel)]="newUser.address" />
    </div>

    <div class="dialog-actions">
      <button type="button" class="btn-outline" (click)="onCancel()" [disabled]="isSubmitting">Cancel</button>
      <button type="submit" class="btn-primary" [disabled]="userForm.invalid || isSubmitting">
        <svg *ngIf="isSubmitting" class="spinner" xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 12a9 9 0 1 1-6.219-8.56" />
        </svg>
        <span *ngIf="!isSubmitting">Create User</span>
      </button>
    </div>
  </form>
</div>
