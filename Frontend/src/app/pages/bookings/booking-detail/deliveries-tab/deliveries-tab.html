<div class="section-card">
  <div class="section-header">
    <div class="section-title-plain">Post-Event Deliveries</div>
    <button class="btn-primary btn-sm" (click)="onOpenAdd()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
      Add Delivery
    </button>
  </div>

  <div class="assignment-list">
<div class="assignment-row" *ngFor="let d of booking.deliveries; trackBy: trackByDeliveryId">      <div class="assignment-left">
        <div class="assignment-avatar assignment-avatar-amber">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/><path d="M12 22V12"/><polyline points="3.29 7 12 12 20.71 7"/><path d="m7.5 4.27 9 5.15"/></svg>
        </div>
        <div>
          <div class="assignment-name">{{ d.type }} - {{ d.description }}</div>
          <div class="assignment-meta" *ngIf="d.status === 'Delivered' && d.delivered_date">
            <span>• Delivered {{ formatDate(d.delivered_date) }}</span>
          </div>
        </div>
      </div>
      <div class="assignment-right">
        <span class="badge" [ngClass]="statusClass(d.status)">{{ d.status }}</span>
        <button class="btn-outline btn-sm" *ngIf="d.status === 'Pending'" (click)="startDelivery.emit(d)">Start</button>
        <button class="btn-outline btn-sm" *ngIf="d.status === 'In Progress'" (click)="markReady.emit(d)">Mark Ready</button>
        <button class="icon-btn-destructive" type="button" (click)="onDeleteClick(d)" aria-label="Delete delivery">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 11v6"/><path d="M14 11v6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>

<app-delivery-modal
  *ngIf="showAddModal"
  (closeModal)="onCloseAdd()"
  (create)="onSubmitAdd($event)"
></app-delivery-modal>

<div class="dialog-overlay" *ngIf="confirmDeleteTarget">
  <div class="dialog-content confirm-dialog">
    <h2>Confirm Delete</h2>
    <p class="confirm-text">Delete this delivery item?</p>
    <div class="dialog-actions">
      <button type="button" class="btn-outline" (click)="onCancelDelete()">Cancel</button>
      <button type="button" class="btn-destructive" (click)="onConfirmDelete()">Delete</button>
    </div>
  </div>
</div>
