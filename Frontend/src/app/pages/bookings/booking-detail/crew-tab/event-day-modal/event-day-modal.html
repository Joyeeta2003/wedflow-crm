<div class="dialog-overlay">
  <div class="dialog-content">
    <div class="dialog-header">
      <h2>Add Event Day</h2>
      <button type="button" class="dialog-close" (click)="onCancel()" aria-label="Close">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>

    <form #dayForm="ngForm" (ngSubmit)="onSubmit(dayForm)" class="dialog-form">
      <div class="form-group">
        <label>Event Type *</label>
        <div class="custom-select">
          <button
            type="button"
            class="custom-select-trigger"
            [class.input-error]="typeInvalid"
            (click)="toggleTypeDropdown()"
          >
            <span [class.placeholder]="!day.eventType">{{ day.eventType || 'Select type' }}</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" [class.rotated]="isTypeOpen"><path d="m6 9 6 6 6-6"/></svg>
          </button>

          <div class="custom-select-backdrop" *ngIf="isTypeOpen" (click)="closeTypeDropdown()"></div>

          <div class="custom-select-menu" *ngIf="isTypeOpen">
            <button
              type="button"
              class="custom-select-option"
              *ngFor="let t of eventTypes"
              [class.selected]="day.eventType === t"
              (click)="selectType(t)"
            >{{ t }}</button>
          </div>
        </div>
        <p class="field-error" *ngIf="typeInvalid">Event Type is required</p>
      </div>

      <div class="form-group form-checkbox-group">
        <input id="datePending" name="datePending" type="checkbox" [(ngModel)]="day.datePending" />
        <label for="datePending">Date not yet confirmed (mark as pending)</label>
      </div>

      <div class="form-group" *ngIf="!day.datePending">
        <label for="date">Date *</label>
        <input
          id="date" name="date" type="date" class="form-input"
          [(ngModel)]="day.date" required
          #dateField="ngModel"
          [class.input-error]="dateField.invalid && dateField.touched"
        />
        <p class="field-error" *ngIf="dateField.invalid && dateField.touched">Date is required</p>
      </div>

      <div class="form-group">
        <label for="venue">Venue</label>
        <input id="venue" name="venue" type="text" class="form-input" placeholder="e.g. Grand Ballroom, Hotel Taj" [(ngModel)]="day.venue" />
      </div>

      <div class="form-group">
        <label for="notes">Notes</label>
        <input id="notes" name="notes" type="text" class="form-input" placeholder="Any notes..." [(ngModel)]="day.notes" />
      </div>

      <div class="dialog-actions">
        <button type="button" class="btn-outline" (click)="onCancel()" [disabled]="isSubmitting">Cancel</button>
        <button type="submit" class="btn-primary" [disabled]="isSubmitting">
          <svg *ngIf="isSubmitting" class="spinner" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
          {{ isSubmitting ? 'Adding...' : 'Add Event Day' }}
        </button>
      </div>
    </form>
  </div>
</div>
