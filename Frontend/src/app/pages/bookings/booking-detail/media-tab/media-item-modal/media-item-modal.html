<div class="dialog-overlay">
  <div class="dialog-content">
    <div class="dialog-header">
      <h2>Add Memory Card / Storage</h2>
      <button type="button" class="dialog-close" (click)="onCancel()" aria-label="Close">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
      </button>
    </div>

    <form #mediaForm="ngForm" (ngSubmit)="onSubmit(mediaForm)" class="dialog-form">
      <div class="form-group">
        <label>Media Type *</label>
        <div class="custom-select">
          <button type="button" class="custom-select-trigger" (click)="toggleTypeDropdown()">
            <span>{{ item.mediaType }}</span>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" [class.rotated]="isTypeOpen"><path d="m6 9 6 6 6-6"/></svg>
          </button>
          <div class="custom-select-backdrop" *ngIf="isTypeOpen" (click)="closeTypeDropdown()"></div>
          <div class="custom-select-menu" *ngIf="isTypeOpen">
            <button
              type="button" class="custom-select-option"
              *ngFor="let t of mediaTypes"
              [class.selected]="item.mediaType === t"
              (click)="selectType(t)"
            >{{ t }}</button>
          </div>
        </div>
      </div>

      <div class="form-group">
        <label for="label">Card / Disk Label *</label>
        <input
          id="label" name="label" type="text" class="form-input"
          placeholder="e.g. Card-01, Disk-A"
          [(ngModel)]="item.label" required
          [class.input-error]="labelInvalid"
          (blur)="labelTouched = true"
        />
        <p class="field-error" *ngIf="labelInvalid">Label is required</p>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label for="capacity">Capacity</label>
          <input id="capacity" name="capacity" type="text" class="form-input" placeholder="e.g. 128GB" [(ngModel)]="item.capacity" />
        </div>
        <div class="form-group">
          <label for="photographer">With Photographer</label>
          <input id="photographer" name="photographer" type="text" class="form-input" placeholder="Rahul Sharma" [(ngModel)]="item.photographer" />
        </div>
      </div>

      <div class="form-group">
        <label for="notes">Notes</label>
        <input id="notes" name="notes" type="text" class="form-input" placeholder="Any notes..." [(ngModel)]="item.notes" />
      </div>

      <div class="dialog-actions">
        <button type="button" class="btn-outline" (click)="onCancel()" [disabled]="isSubmitting">Cancel</button>
        <button type="submit" class="btn-primary" [disabled]="isSubmitting">
          <svg *ngIf="isSubmitting" class="spinner" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
          {{ isSubmitting ? 'Adding...' : 'Add' }}
        </button>
      </div>
    </form>
  </div>
</div>
