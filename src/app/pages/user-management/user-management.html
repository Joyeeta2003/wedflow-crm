<div class="user-mgmt-page">
  <div class="page-header">
    <div>
      <h1 class="page-title">User Management</h1>
      <p class="page-subtitle">{{ totalUsers }} users · {{ activeUsers }} active</p>
    </div>
    <button class="btn-primary" (click)="onNewUser()">
      <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M5 12h14" />
        <path d="M12 5v14" />
      </svg>
      New User
    </button>
  </div>

  <div class="role-group" *ngFor="let group of groupedUsers" [attr.data-role]="group.role">
    <h2 class="role-title">{{ group.role }} ({{ group.users.length }})</h2>

    <div class="user-list">
      <div class="user-row" *ngFor="let user of group.users">
        <div class="user-info">
          <div class="user-avatar">{{ user.name.charAt(0) }}</div>
          <div class="user-text">
            <div class="user-name-row">
              <span class="user-name">{{ user.name }}</span>
            </div>
            <div class="user-meta">
              <span>&#64;{{ user.email }}</span>
              <span *ngIf="user.staffName"> · Staff: {{ user.staffName }}</span>
              <span> · Joined {{ formatDate(user.joinedAt) }}</span>
            </div>
          </div>
        </div>

        <div class="user-actions">
          <div class="role-badge">{{ group.role }}</div>
          <button class="icon-btn" (click)="onEdit(user)">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z" />
            </svg>
          </button>
          <button class="icon-btn icon-btn--danger" (click)="onDelete(user)">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-trash2 lucide-trash-2 h-3.5 w-3.5" aria-hidden="true" style="color: rgb(204, 51, 51);"><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"></path><path d="M3 6h18"></path><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<app-user-modal
  [isOpen]="showNewUserModal"
  (closeModal)="onModalClose()"
  (create)="onUserCreate($event)"
></app-user-modal>
