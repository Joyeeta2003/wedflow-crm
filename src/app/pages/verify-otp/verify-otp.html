<div class="verify-page">
  <div class="verify-card">
    <div class="header-block">
      <div class="badge">OTP Verification</div>
      <h2>Verify your email</h2>
      <p>Enter the 6-digit code sent to your email.</p>
    </div>

    <form (ngSubmit)="onVerifyOtp()">
      <div class="field-group">
        <label for="otp">One-time password</label>
        <input id="otp" name="otp" type="text" inputmode="numeric" maxlength="6" placeholder="123456" [(ngModel)]="otp" />
      </div>

      <div class="field-group">
        <label for="firstName">First name</label>
        <input id="firstName" name="firstName" type="text" placeholder="First name" [(ngModel)]="firstName" />
      </div>

      <div class="field-group">
        <label for="lastName">Last name</label>
        <input id="lastName" name="lastName" type="text" placeholder="Last name" [(ngModel)]="lastName" />
      </div>

      <div class="field-group">
        <label for="phoneNumber">Phone number</label>
        <input id="phoneNumber" name="phoneNumber" type="tel" placeholder="Phone number" [(ngModel)]="phoneNumber" />
      </div>

      <p class="error-message" *ngIf="errorMessage()">{{ errorMessage() }}</p>

      <button type="submit" [disabled]="isSubmitting()">
        {{ isSubmitting() ? 'Verifying...' : 'Verify OTP' }}
      </button>
    </form>

    <button type="button" class="secondary-btn" (click)="onResendOtp()" [disabled]="isSubmitting()">
      Resend OTP
    </button>
  </div>
</div>
