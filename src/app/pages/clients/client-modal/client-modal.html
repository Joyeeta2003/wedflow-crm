<div class="dialog-overlay" *ngIf="isOpen" (click)="onCancel()"></div>

<div class="dialog-content" role="dialog" *ngIf="isOpen" tabindex="-1">
  <div class="dialog-header">
    <h2 class="dialog-title">New Client</h2>
  </div>

  <form class="dialog-form" (ngSubmit)="onSubmit(clientForm)" #clientForm="ngForm">
    <div class="form-group">
      <label class="form-label" for="name">Full Name *</label>
      <input
        class="form-input"
        id="name"
        name="name"
        placeholder="Ananya & Rohan"
        [(ngModel)]="newClient.name"
        required
      />
    </div>

    <div class="form-group">
      <label class="form-label" for="phone">Phone *</label>
      <input
        class="form-input"
        id="phone"
        name="phone"
        placeholder="+91 98765 43210"
        [(ngModel)]="newClient.phone"
        required
      />
    </div>

    <div class="form-group">
      <label class="form-label" for="email">Email</label>
      <input
        class="form-input"
        id="email"
        name="email"
        type="email"
        placeholder="email@example.com"
        [(ngModel)]="newClient.email"
      />
    </div>

    <div class="form-group">
      <label class="form-label" for="address">Address</label>
      <input
        class="form-input"
        id="address"
        name="address"
        placeholder="123 Park St, Kolkata"
        [(ngModel)]="newClient.address"
      />
    </div>

    <div class="form-group">
      <label class="form-label" for="notes">Notes</label>
      <textarea
        class="form-textarea"
        id="notes"
        name="notes"
        placeholder="Any notes about this client..."
        [(ngModel)]="newClient.notes"
      ></textarea>
    </div>

    <div class="dialog-actions">
      <button type="button" class="btn-outline" (click)="onCancel()">Cancel</button>
      <button type="submit" class="btn-primary" [disabled]="clientForm.invalid">Create</button>
    </div>
  </form>

  <button type="button" class="dialog-close" (click)="onCancel()">
    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
      stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="icon-close">
      <path d="M18 6 6 18" />
      <path d="M6 6l12 12" />
    </svg>
    <span class="sr-only">Close</span>
  </button>
</div>
