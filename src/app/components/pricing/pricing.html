<section class="pricing">
    <div class="pricing-glow"></div>
    <div class="pricing-container">
        <div class="pricing-badge">
            <div class="icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    class="lucide lucide-crown" aria-hidden="true" style="width: 11px; height: 11px;">
                    <path
                        d="M11.562 3.266a.5.5 0 0 1 .876 0L15.39 8.87a1 1 0 0 0 1.516.294L21.183 5.5a.5.5 0 0 1 .798.519l-2.834 10.246a1 1 0 0 1-.956.734H5.81a1 1 0 0 1-.957-.734L2.02 6.02a.5.5 0 0 1 .798-.519l4.276 3.664a1 1 0 0 0 1.516-.294z">
                    </path>
                    <path d="M5 21h14"></path>
                </svg>
                PRICING
            </div>

            <h2 class="pricing-title">Simple, transparent pricing</h2>
            <p class="pricing-subtitle">Start free, scale as you grow</p>

        </div>

        <div class="pricing-grid">
            @for (plan of pricingPlans; track plan.id) {
            <app-pricing-card [plan]="plan"></app-pricing-card>
            }
        </div>
    </div>
</section>
