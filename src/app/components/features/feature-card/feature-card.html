<div class="feature-card">
    <div class="feature-card-glow"></div>
    <div class="feature-card-icon-wrap">
        <lucide-icon [img]="feature().icon" [strokeWidth]="2.5" class="feature-icon">
        </lucide-icon>
    </div>
    <h3 class="feature-card-title">{{ feature().title }}</h3>
    <p class="feature-card-desc">{{ feature().description }}</p>
</div>
